services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dundee
      POSTGRES_PASSWORD: dundee
      POSTGRES_DB: dundee_game
    ports:
      - "5434:5432"
    volumes:
      - dundee_game_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dundee -d dundee_game"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dundee_game_pg:
